name: 'dbt_olist_logistics'
version: '1.0.0'
config-version: 2

profile: 'dbt_olist_logistics'

require-dbt-version: [">=1.11.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_olist_logistics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
