version: 2

models:
  - name: int_data_quality_flags
    description: "One row per order_month. Independently-computed data-quality percentages; never combined."
    columns:
      - name: order_month
        description: "Primary key. Month start, dateTrunc('month', order_purchase_timestamp). Only months with >=1 order."
        tests:
          - unique
          - not_null
      - name: pct_orders_unavailable_delivery_data
        description: "Orders with severity 'Delivery data unavailable' / orders expected to deliver (severity != 'Canceled or unavailable') in month. Restricted to orders expected to deliver, so it measures a real data gap rather than canceled/unavailable orders."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_orders_canceled_or_unavailable
        description: "Orders with severity 'Canceled or unavailable' / all orders in month. Operational context, not a data-quality gap."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_orders_missing_review
        description: "Orders with null review_score / all orders in month."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_orders_impossible_date_ordering
        description: "Orders with delivered date before purchase date / all orders in month."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
