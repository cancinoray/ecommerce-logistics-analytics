version: 2

models:
  - name: int_customer_experience_metrics
    description: "One row per order_id, 1:1 with int_order_delivery_metrics. Review score alongside delivery severity."
    columns:
      - name: order_id
        description: "Primary key. One row per order."
        tests:
          - unique
          - not_null
      - name: review_score
        description: "Review score 1-5, null when no review given."
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
