version: 2

models:
  - name: int_order_delivery_metrics
    description: "One row per order_id, 1:1 with stg_orders. Per-order delivery delay_days and severity classification."
    columns:
      - name: order_id
        description: "Primary key. One row per order."
        tests:
          - unique
          - not_null
      - name: delay_days
        description: "dateDiff day(delivered_customer - estimated_delivery). NULL if either date is NULL."
      - name: severity
        description: "One of: On Time, 1-3 days late, 4-7 days late, 8+ days late, Delivery data unavailable."
        tests:
          - accepted_values:
              arguments:
                values: ['On Time', '1-3 days late', '4-7 days late', '8+ days late', 'Delivery data unavailable']
