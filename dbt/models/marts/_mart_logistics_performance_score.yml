version: 2

models:
  - name: mart_logistics_performance_score
    description: "Composite 0-100 Logistics Performance Score, one row per order_month. Delivery 40%, Customer Experience 30%, Logistics Cost 20%, Seller Performance 10%, re-weighted over computable components only. Full-refresh."
    columns:
      - name: order_month
        description: "Primary key. Calendar month (month start) derived from order_purchase_timestamp."
        tests:
          - unique
          - not_null
      - name: final_score
        description: "Composite score, weighted average over computable components, re-normalized to sum 100%."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: order_count
        description: "Sample size: number of orders in the month (count(*) over fct_orders where order_purchase_timestamp is not null). Always >= 1 for emitted months."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: delivery_coverage
        description: "Share of the month's orders with a usable delivery outcome (On Time / 1-3 / 4-7 / 8+ days late) over order_count; 0 means the delivery component is non-computable and the score is re-weighted over the remaining components."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
