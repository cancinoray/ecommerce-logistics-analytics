version: 2

models:
  - name: mart_data_quality
    description: "Thin marts passthrough of int_data_quality_flags. One row per order_month. Independent percentages, never blended; never referenced by mart_logistics_performance_score. Full-refresh."
    columns:
      - name: order_month
        description: "Primary key. Calendar month (month start). Only months with >=1 order."
        tests:
          - unique
          - not_null
      - name: pct_orders_unavailable_delivery_data
        description: "Orders with severity 'Delivery data unavailable' / orders expected to deliver (severity != 'Canceled or unavailable') in month, unchanged from int_data_quality_flags."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_orders_canceled_or_unavailable
        description: "Orders with severity 'Canceled or unavailable' / all orders in month. Operational context, not a data-quality gap, unchanged from int_data_quality_flags."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_orders_missing_review
        description: "Orders with null review_score / all orders in month, unchanged from int_data_quality_flags."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_orders_impossible_date_ordering
        description: "Orders with delivered date before purchase date / all orders in month, unchanged from int_data_quality_flags."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
