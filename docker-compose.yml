services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  metabase:
    build:
      context: ./metabase
    image: ecommerce-logistics-analytics-metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
      # NOTE: the plugins volume shadows the driver jar baked into the
      # image. On a truly fresh `up` (empty volume) Docker copies the
      # image's /plugins content (including clickhouse.metabase-driver.jar)
      # into the volume; on existing volumes the already-installed jar wins.
      - metabase-plugins:/plugins
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      # Weak complexity so the shared analytics/analytics dev login (matching
      # the ClickHouse credentials above) is accepted. Dev-only, insecure by design.
      MB_PASSWORD_COMPLEXITY: weak
    healthcheck:
      # Can take ~60s to report ok on first boot while Metabase
      # initializes its app database.
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  metabase-init:
    # Replays the checked-in Metabase exports (connections, cards,
    # dashboards, landing page) via the REST API. Idempotent: safe to
    # re-run against an already-configured instance.
    image: python:3.12-slim
    command: ["python", "/metabase-init/setup_metabase.py"]
    volumes:
      - ./metabase/setup_metabase.py:/metabase-init/setup_metabase.py:ro
      - ./metabase/exports:/metabase-init/exports:ro
    environment:
      MB_URL: http://metabase:3000
      MB_ADMIN_EMAIL: analytics@analytics.local
      MB_ADMIN_PASSWORD: analytics
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
    depends_on:
      metabase:
        condition: service_healthy
    restart: "no"

  dbt:
    build:
      context: ./dbt
    command: ["tail", "-f", "/dev/null"]
    ports:
      # dbt docs serve (run manually; see README's "Full Model Lineage" section)
      - "8080:8080"
    volumes:
      # Bind-mount project files so model/test edits are visible in the
      # container without rebuilding the image. Individual paths (not
      # ./dbt:/dbt) so the image-built /dbt/.venv and dbt_packages are
      # not shadowed. Rebuild still required after pyproject.toml/uv.lock
      # changes; `dbt deps` still required after packages.yml changes.
      - ./dbt/models:/dbt/models
      - ./dbt/tests:/dbt/tests
      - ./dbt/dbt_project.yml:/dbt/dbt_project.yml
      - ./dbt/profiles.yml:/dbt/profiles.yml
      - ./dbt/packages.yml:/dbt/packages.yml
      - ./dbt/package-lock.yml:/dbt/package-lock.yml
      # Named volume for the venv (built by `uv sync` on start, not baked
      # into the image) so pyproject.toml/uv.lock changes apply with just
      # `docker compose restart dbt` instead of a rebuild.
      - dbt-venv:/dbt/.venv
      - ./dbt/entrypoint.sh:/dbt/entrypoint.sh
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
      CLICKHOUSE_SCHEMA: ${CLICKHOUSE_SCHEMA:-marts}
      DBT_PROFILES_DIR: /dbt
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  metabase-data:
  metabase-plugins:
  dbt-venv:
